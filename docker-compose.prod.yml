# Supported single-host SQLite baseline, NOT approval for a mainnet launch.
# PostgreSQL requires a separately tested schema + data migration; a connection
# URL cannot change the committed Prisma sqlite provider. See the audit/runbook.
services:
  backend:
    build: ./aof_backend
    restart: unless-stopped
    env_file: ./aof_backend/.env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: file:/app/data/aof.db?connection_limit=1
      # Port 8080 is bound to loopback below, so a reverse proxy on the host
      # is the only path in. Override if a second hop (CDN/LB) is added.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - aof_data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Opt-in recovery worker; not a second automatic writer on the SQLite DB.
  commit-expirer:
    profiles: [recovery]
    build: ./aof_backend
    restart: unless-stopped
    command: ["node", "dist-workers/services/commit-expirer/index.js"]
    depends_on:
      backend:
        condition: service_healthy
    env_file: ./aof_backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/aof.db?connection_limit=1
    volumes:
      - aof_data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  aof_data:
