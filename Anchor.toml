[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "solana/keys/aof-authority-devnet.json"

[test]
# CI loads several upgradeable programs into the local validator before the
# first RPC blockhash is available; allow a cold validator 30 seconds to start.
startup_wait = 30000
# Initialize читает канонический ProgramData апгрейд-лоадера, чтобы привязать
# Config.authority к фактическому upgrade authority, а не к произвольному
# подписанту. Без upgradeable-деплоя этого аккаунта нет, и bootstrap падает.
upgradeable = true

[test.validator]
# Agave 4.2.1 panics during startup when the bind address is unspecified.
bind_address = "127.0.0.1"
# Eight ticks leave normal transaction headroom while advancing the active
# 18k-slot VRF expiry test; the on-chain threshold remains unchanged.
ticks_per_slot = 8

[scripts]
# IDL builder is upstream-blocked (anchor-syn 0.30.1 + proc-macro2 1.0.94 vs newer rustc).
# CI seeds target/idl from aof_backend/src/idl and runs with --skip-build.
# This wrapper does the same locally so `anchor test` doesn't fail with
# "Building IDL failed" / "cannot find type SourceFile".
# Fallback chain: .mjs -> .js -> continue, so missing script doesn't break `anchor test`
# Wallet is auto-created if missing (solana/keys/ is gitignored, CI creates throwaway one).
test = "(node scripts/ensure-env.mjs 2>/dev/null || node scripts/ensure-env.js 2>/dev/null || node scripts/ensure-idl.mjs 2>/dev/null || node scripts/ensure-idl.js 2>/dev/null || echo '[warn] ensure-idl scripts not found, expecting target/idl to exist') && npx tsx node_modules/mocha/bin/mocha.js -t 1000000 tests/aof_core.ts tests/aof_payer_funding.ts tests/aof_tool_ownership.ts tests/aof_extended.ts tests/aof_market.ts tests/aof_vrf_localnet.ts tests/aof_cu_report.ts"
