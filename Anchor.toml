aof_rebirth = "HHwA5u7oZUkP26ZWidB1tWZsztN2MRfF1iV29m3bbSKF"
aof_quests = "2SLSduEGX9UDXH2h1P37ELzdPagJuV752favytPixdKc"
aof_market = "A3PRU6Z8GywzWxkS8rDGgqbobToknAuQya3ot6XvGBuY"
