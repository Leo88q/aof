# gitleaks configuration for AOF. Extends the default ruleset; allowlist covers
# documented placeholders and Solana public keys (base58 32-byte pubkeys are
# not secrets; 64-byte keypairs are and remain detected by the default rules).
[extend]
useDefault = true

[allowlist]
description = "Placeholders, examples, and public identifiers"
paths = [
  '''aof_backend/\.env\.example$''',
  '''frontend/\.env\.example$''',
  '''package-lock\.json$''',
  '''Cargo\.lock$''',
  '''src/idl/.*\.json$''',
  '''^idl_raw\.json$''',
]
regexes = [
  '''<long random string>''',
  '''<different long random string>''',
  '''<random string>''',
  '''postgresql://user:pass@host''',
  '''file:(\.\./|/app/|/abs/)''',
  # Solana 32-byte public keys: base58, 43-44 chars, no 0/O/I/l (documented
  # in the header above). \b on both sides so an 88-char base58 64-byte
  # secret key can never match a 43-44 window inside itself.
  '''\b[1-9A-HJ-NP-Za-km-z]{43,44}\b''',
]
