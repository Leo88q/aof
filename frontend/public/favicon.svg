<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#9B59FF"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#06060F"/>
  <!-- Neural network nodes -->
  <circle cx="8" cy="8" r="2.5" fill="url(#g)" opacity="0.9"/>
  <circle cx="8" cy="24" r="2.5" fill="url(#g)" opacity="0.9"/>
  <circle cx="24" cy="8" r="2.5" fill="url(#g)" opacity="0.9"/>
  <circle cx="24" cy="24" r="2.5" fill="url(#g)" opacity="0.9"/>
  <circle cx="16" cy="16" r="3" fill="url(#g)"/>
  <!-- Connections -->
  <line x1="8" y1="8" x2="16" y2="16" stroke="url(#g)" stroke-width="1" opacity="0.5"/>
  <line x1="8" y1="24" x2="16" y2="16" stroke="url(#g)" stroke-width="1" opacity="0.5"/>
  <line x1="24" y1="8" x2="16" y2="16" stroke="url(#g)" stroke-width="1" opacity="0.5"/>
  <line x1="24" y1="24" x2="16" y2="16" stroke="url(#g)" stroke-width="1" opacity="0.5"/>
  <!-- Outer glow -->
  <circle cx="16" cy="16" r="3" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>
  <circle cx="16" cy="16" r="5" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.15"/>
</svg>
