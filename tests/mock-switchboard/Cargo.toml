# Test double of Switchboard On-Demand's randomness instructions, for the local
# validator of the CI job "Anchor test" ONLY (see src/lib.rs). It is not a
# workspace member, is never deployed to a cluster, and the CI job builds it
# with the workspace Cargo.lock copied next to this manifest so that
# solana-program resolves to the same audited versions as the programs.
[package]
name = "mock-switchboard"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=1.18.26"

[profile.release]
overflow-checks = true

# Standalone: not part of the repository workspace (Cargo.toml at the root).
[workspace]
