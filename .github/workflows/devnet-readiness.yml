name: Devnet readiness (read-only, no signer)

# Зачем: владелец видит в игре красные плашки «сеть не настроена», а из
# песочницы агента RPC недоступен (api.devnet.solana.com не отвечает), поэтому
# «что именно не настроено на девнете» нельзя было сказать фактами. Этот
# workflow запускает тот же читающий preflight, что и релизный гейт, но печатает
# отчёт в лог, чтобы состояние девнета было видно без ручного запуска.
#
# Ничего не подписывает: ни ключа, ни транзакции, ни airdrop, ни записи в БД.
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/01a0efab-aof'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aof_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aof_backend/package-lock.json
      - name: Install backend dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline guards for the same readers
        run: |
          npm run test:mining-preflight
          npm run test:mining-flag
      - name: Public devnet reachability
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 \
            https://api.devnet.solana.com -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' || echo 000)
          echo "api.devnet.solana.com HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
      - name: Read-only devnet state (mining, mints, config)
        env:
          MINING_PREFLIGHT_REPORT: ${{ runner.temp }}/mining-devnet-preflight.json
        run: |
          set -uo pipefail
          npm run preflight:mining-devnet 2>&1 | tee /tmp/preflight.log || true
          echo "=== mining-devnet-preflight.json ==="
          cat "${MINING_PREFLIGHT_REPORT}" 2>/dev/null || echo "report not written"
      - name: Which program IDs answer on devnet
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, urllib.request
          ids = json.load(open('../watchtower/addresses.json'))['programs']
          rpc = 'https://api.devnet.solana.com'
          def call(method, params):
              body = json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req = urllib.request.Request(rpc, data=body, headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          for entry in ids:
              try:
                  info = call('getAccountInfo', [entry['address'], {'encoding':'base64'}]).get('result', {}).get('value')
                  if info is None:
                      print(f"{entry['name']:16} {entry['address']}  -> НЕТ АККАУНТА (программа не задеплоена)")
                  else:
                      print(f"{entry['name']:16} {entry['address']}  -> owner={info['owner']} executable={info['executable']} bytes={len(info.get('data',[''])[0])*3//4}")
              except Exception as e:
                  print(f"{entry['name']:16} {entry['address']}  -> ошибка чтения: {e}")
          PY
      - name: Add report to run summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/mining-devnet-preflight.json
        run: |
          if [ -f "$REPORT" ]; then
            echo '### Состояние девнета (только чтение; байткод и подписи не проверяются)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
