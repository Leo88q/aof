name: AOF readiness regressions
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-idl-drift.py
      - run: python3 scripts/test-p0-security.py
      # [F-06] aof-quests carries a generated copy of aof-core's vrf.rs.
      - run: python3 scripts/sync-quests-vrf.py --check
      # [SECURITY #117/#130] скрытые юникод-символы (включая Trojan Source) и
      # SHA-пиннинг конфигов агентов — ровно те же шаги, что в `make security-static`.
      - run: node scripts/security/check-hidden-unicode.mjs
      - run: node scripts/security/agent-config-lock.mjs --check
      # [SECURITY #98/#116/#128] реестр программ/апстримов/ключей: адреса сверяются
      # с declare_id!/Anchor.toml/IDL/txGuard, у депрекейта обязателен drain,
      # пины апстримов обязаны существовать в lock-файлах.
      - run: node scripts/security/program-registry.mjs --check
      # [SECURITY #130] навыки и конфиги ИИ-агентов: опасные инструкции и SHA-пиннинг.
      - run: node scripts/security/check-agent-skills.mjs
      # [SECURITY #116/#128] апстрим-дозор (offline): у каждой зависимости есть
      # pin в lock-файле, источник advisory и запись в реестре форков/движков.
      - run: node scripts/security/upstream-watch.mjs --check
      - run: node --test tests/readiness/*.test.cjs
      # [SECURITY_CHECKLIST #66] blocking audit of shipped (runtime) dependencies
      - run: node scripts/audit-gate.mjs
      - run: npm test --prefix src/os
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: aof_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check grants, RLS and cached projection with real roles
        env:
          PGPASSWORD: local-test-only
        run: |
          psql -h localhost -U postgres -d aof_rls_test -v ON_ERROR_STOP=1 -f src/os/sql/cross_game_materials.sql
          psql -h localhost -U postgres -d aof_rls_test -v ON_ERROR_STOP=1 -f tests/sql/cross-game-materials-isolation.sql
