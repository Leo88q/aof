# [F-06] Real-network check of the Switchboard On-Demand path the game relies
# on (aof_backend/scripts/vrfDevnetProbe.ts): oracle selection against the live
# devnet queue, then commit -> gateway reveal WITHOUT an RPC URL -> on-chain
# reveal, once per eligible oracle. Push/schedule runs are fail-closed: they
# never invoke the transaction probe. A manual run must set the explicit boolean
# input and provide a funded DEVNET_PROBE_KEYPAIR secret.
#
# The opted-in probe mutates devnet: it may request an airdrop, creates a
# randomness account, submits commit/reveal transactions, then closes it. Do not
# opt in unless a devnet transaction is explicitly authorized.
# Optional secret DEVNET_RPC_URL overrides the public devnet endpoint.
name: VRF devnet probe
on:
  push:
    paths:
      - aof_backend/scripts/vrfDevnetProbe.ts
      - aof_backend/src/lib/vrf.ts
      - aof_backend/package-lock.json
      - .github/workflows/vrf-devnet-probe.yml
  workflow_dispatch:
    inputs:
      allow_devnet_transactions:
        description: 'Explicitly authorize devnet airdrop/account/commit/reveal/close transactions for this manual run.'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
permissions:
  contents: read
  checks: write
concurrency:
  group: vrf-devnet-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    name: Switchboard devnet probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aof_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aof_backend/package-lock.json
      - name: Install backend dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail-closed report when no explicit manual opt-in was supplied
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_devnet_transactions != true }}
        env:
          VRF_PROBE_REPORT: ${{ runner.temp }}/vrf-devnet-probe.md
        run: |
          cat > "$VRF_PROBE_REPORT" <<'EOF'
          # SKIPPED — no devnet transactions authorized

          Pushes and scheduled runs never submit transactions. A manual run must
          explicitly set `allow_devnet_transactions: true` and provide the
          funded `DEVNET_PROBE_KEYPAIR` repository secret.
          EOF
      - name: Require the explicit funded probe wallet
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_devnet_transactions == true }}
        env:
          DEVNET_PROBE_KEYPAIR: ${{ secrets.DEVNET_PROBE_KEYPAIR }}
        run: |
          if [ -z "$DEVNET_PROBE_KEYPAIR" ]; then
            echo "::error::refusing to run: DEVNET_PROBE_KEYPAIR is required; faucet fallback is disabled in CI"
            exit 1
          fi
      - name: Probe (manual opt-in only; submits devnet transactions)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_devnet_transactions == true }}
        id: probe
        env:
          DEVNET_PROBE_KEYPAIR: ${{ secrets.DEVNET_PROBE_KEYPAIR }}
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
          VRF_PROBE_REPORT: ${{ runner.temp }}/vrf-devnet-probe.md
        run: npx ts-node --project tsconfig.json --transpile-only scripts/vrfDevnetProbe.ts
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/vrf-devnet-probe.md
        run: |
          set -uo pipefail
          if [ ! -f "$REPORT" ]; then
            echo "::warning::the probe wrote no report"
            exit 0
          fi
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          title=$(head -1 "$REPORT" | sed 's/^# //')
          case "$title" in
            *SKIPPED*) echo "::warning title=VRF devnet probe::$title" ;;
            *FAILED*) echo "::error title=VRF devnet probe::$title" ;;
            *) echo "::notice title=VRF devnet probe::$title" ;;
          esac
          job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == "Switchboard devnet probe") | .id' 2>/dev/null | head -1)
          [ -n "$job_id" ] || exit 0
          jq -n --arg title "$title" --arg summary "aof_backend/scripts/vrfDevnetProbe.ts against the live devnet queue." \
            --rawfile text "$REPORT" '{output: {title: $title, summary: $summary, text: $text}}' > "$RUNNER_TEMP/probe-payload.json"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$job_id" --input "$RUNNER_TEMP/probe-payload.json" >/dev/null \
            || echo "::notice::check-run output not updated"
