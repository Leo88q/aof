[package]
name = "aof-core"
version = "0.1.0"
description = "Age of Farming core program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aof_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Trust the devnet Switchboard On-Demand program in vrf.rs (mainnet otherwise).
devnet = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"