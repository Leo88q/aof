[package]
name = "aof-market"
version = "0.1.0"
description = "Age of Farming Hot Market + Session Keys"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aof_market"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
